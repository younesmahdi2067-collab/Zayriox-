<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Zayriox</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(120% 90% at 50% 0%, #1b1730 0%, #0c0c0f 60%);
    color: #ececf1; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    -webkit-app-region: drag; user-select: none; overflow: hidden;
  }
  .orb-wrap { position: relative; width: 96px; height: 96px; }
  .orb {
    position: absolute; inset: 18px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #d9d2ff 0%, #8b7bff 38%, #4632c8 78%, #241a72 100%);
    box-shadow: 0 0 40px 6px rgba(139,123,255,.35);
    animation: breathe 2.6s ease-in-out infinite;
  }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid transparent; border-top-color: #b8adff; border-right-color: rgba(184,173,255,.25);
    animation: spin 1.5s linear infinite;
  }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: .02em; }
  .status { font-size: 13.5px; color: #a2a2ad; min-height: 18px; }
  .bar { width: 210px; height: 3px; border-radius: 3px; background: #24242c; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 3px;
    background: linear-gradient(90deg, transparent, #9d8fff, transparent); animation: slide 1.3s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(1.08); box-shadow: 0 0 56px 10px rgba(139,123,255,.45); } }
  @keyframes slide { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .orb, .ring, .bar i { animation: none; } }
</style>
</head>
<body>
  <div class="orb-wrap"><div class="ring"></div><div class="orb"></div></div>
  <h1>Zayriox</h1>
  <div class="bar"><i></i></div>
  <div class="status" id="status">Zayriox wird gestartet…</div>
  <script src="splash.js"></script>
</body>
</html>
