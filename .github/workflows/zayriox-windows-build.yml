name: Zayriox Windows-Build (Installer + Selbsttest)

on:
  workflow_dispatch:
    inputs:
      skip_extended:
        description: "Nur Kerntests"
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TEST_MODE: ${{ inputs.skip_extended == true && 'core' || 'full' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Projektordner finden
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE

          $found = Get-ChildItem -Path $ws -Recurse -Filter package.json -File |
            Where-Object {
              $_.FullName -notmatch '[\\/]node_modules[\\/]' -and
              ((Get-Content $_.FullName -Raw | ConvertFrom-Json).name -eq 'zayriox')
            } |
            Select-Object -First 1

          if (-not $found) {
            Write-Error "Keine package.json mit name=zayriox gefunden."
            exit 1
          }

          $dir = $found.DirectoryName
          $rel = [IO.Path]::GetRelativePath($ws, $dir).Replace('\','/')

          Write-Host "Projektordner: $dir"
          "PROJECT_DIR=$rel" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Logik-Tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm test

      - name: Windows-Installer bauen
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run dist

      - name: Build prüfen
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if (-not (Test-Path "dist\Zayriox_Setup.exe")) {
            Write-Error "Zayriox_Setup.exe wurde nicht erzeugt."
            exit 1
          }

          if (-not (Test-Path "dist\win-unpacked\Zayriox.exe")) {
            Write-Error "Zayriox.exe fehlt."
            exit 1
          }

          Write-Host "Build erfolgreich."

      - name: KI-Modell laden
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Invoke-WebRequest `
            -Uri "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" `
            -OutFile "$env:RUNNER_TEMP\selftest-model.gguf"

          $size = (Get-Item "$env:RUNNER_TEMP\selftest-model.gguf").Length

          if ($size -lt 300000000) {
            Write-Error "KI-Modell wurde nicht vollständig heruntergeladen."
            exit 1
          }

      - name: Selbsttest der KI
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $out = "$env:RUNNER_TEMP\selftest-unpacked.json"

          $args = @(
            "--selftest",
            "--selftest-out=$out",
            "--selftest-model=$env:RUNNER_TEMP\selftest-model.gguf",
            "--selftest-dir=$env:RUNNER_TEMP\st1"
          )

          $p = Start-Process `
            -FilePath "dist\win-unpacked\Zayriox.exe" `
            -ArgumentList $args `
            -PassThru

          $null = $p.Handle

          if (-not $p.WaitForExit(2400000)) {
            $p.Kill()
            Write-Error "Selbsttest Zeitüberschreitung."
            exit 1
          }

          if (Test-Path $out) {
            Get-Content $out
          }

          if ($p.ExitCode -ne 0) {
            Write-Error "Selbsttest fehlgeschlagen: Exit $($p.ExitCode)"
            exit 1
          }

          Write-Host "KI-Selbsttest erfolgreich."

      - name: Installer installieren
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $setup = Start-Process `
            -FilePath "dist\Zayriox_Setup.exe" `
            -ArgumentList "/S" `
            -PassThru `
            -Wait

          Write-Host "Installer Exit: $($setup.ExitCode)"

          Start-Sleep -Seconds 8

          $exe = Join-Path `
            $env:LOCALAPPDATA `
            "Programs\Zayriox\Zayriox.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Zayriox wurde nicht installiert."
            exit 1
          }

          "ZAYRIOX_EXE=$exe" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Installierte App testen
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\selftest-installed.json"

          $args = @(
            "--selftest",
            "--selftest-out=$out",
            "--selftest-dir=$env:RUNNER_TEMP\st2"
          )

          $p = Start-Process `
            -FilePath $env:ZAYRIOX_EXE `
            -ArgumentList $args `
            -PassThru

          $null = $p.Handle

          if (-not $p.WaitForExit(2400000)) {
            $p.Kill()
            Write-Error "Installierter Selbsttest Zeitüberschreitung."
            exit 1
          }

          if (Test-Path $out) {
            Get-Content $out
          }

          if ($p.ExitCode -ne 0) {
            Write-Error "Installierte App fehlgeschlagen."
            exit 1
          }

      - name: Normalen App-Start testen
        shell: pwsh
        run: |
          $p = Start-Process `
            -FilePath $env:ZAYRIOX_EXE `
            -PassThru

          $null = $p.Handle

          $ready = $false

          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1

            try {
              $p.Refresh()
            } catch {}

            if ($p.HasExited) {
              Write-Error "Zayriox wurde beim Start beendet."
              exit 1
            }

            if ($p.MainWindowHandle -ne 0) {
              $ready = $true
              break
            }
          }

          if (-not $ready) {
            Write-Error "Zayriox-Fenster wurde nicht gefunden."
            exit 1
          }

          Write-Host "Zayriox läuft."

          & taskkill /PID $p.Id /T /F

      - name: Installer als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Zayriox_Setup
          path: |
            ${{ env.PROJECT_DIR }}/dist/Zayriox_Setup.exe
            ${{ env.PROJECT_DIR }}/dist/latest.yml
            ${{ env.PROJECT_DIR }}/dist/*.blockmap
          if-no-files-found: error

      - name: Testprotokolle hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selbsttest-Protokolle
          path: |
            ${{ runner.temp }}/selftest-*.json
            ${{ runner.temp }}/st1/logs/*.log
            ${{ runner.temp }}/st2/logs/*.log
          if-no-files-found: ignore
          
